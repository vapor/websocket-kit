name: test
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request: { types: [opened, reopened, synchronize, ready_for_review] }
  push: { branches: [ main ] }
permissions:
  contents: read

jobs:
  vapor-integration:
    if: ${{ !(github.event.pull_request.draft || false) }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - name: Check out package
        uses: actions/checkout@v6
        with: { path: 'websocket-kit' }
      - name: Check out Vapor
        uses: actions/checkout@v6
        with: { repository: 'vapor/vapor', path: 'vapor' }
      - name: Use local package in Vapor
        run: swift package --package-path vapor edit websocket-kit --path websocket-kit
      - name: Run Vapor tests
        run: swift test --package-path vapor

  unit-tests:
    permissions:
      contents: read
    uses: vapor/ci/.github/workflows/run-unit-tests.yml@main
    secrets: inherit
    with:
      with_musl: true

  submit-dependencies:
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' }}
    uses: vapor/ci/.github/workflows/submit-deps.yml@main
    secrets: inherit
